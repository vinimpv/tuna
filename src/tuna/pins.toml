# Models that ship their own Python (`auto_map`, loaded with trust_remote_code).
# tuna loads these only through tuna.pinned, only at the exact commit below, and
# only after the code at that commit has been read. Changing a sha means reading
# that revision's Python again and updating `audit`.
#
# patches_lfm2: the model's code monkey-patches transformers.models.lfm2 at
# import time; tuna.pinned allows one such model per process.

